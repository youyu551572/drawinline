# ============================================================
# Render 免费部署配置
# 注册: https://render.com (用 GitHub 登录即可)
# ============================================================

services:
  - type: web
    name: youyu-drawinline
    runtime: python
    region: singapore  # 新加坡节点，国内访问快
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app -w 2 -b 0.0.0.0:$PORT --timeout 30
    envVars:
      - key: API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: youyu551572/drawinline
      - key: GITEE_TOKEN
        sync: false
      - key: GITEE_REPO
        value: youyu551572/drawinline
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
